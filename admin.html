<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>临沂五金 后台</title>
<link rel="stylesheet" href="style.css">
<style>
body{padding-bottom:40px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.top{position:sticky;top:0;z-index:20;background:var(--nav);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:12px;height:48px}
.top h1{font-size:1.05rem;font-weight:700;margin-inline-end:auto;white-space:nowrap}
.top .who{color:var(--muted);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.tabs{display:flex;gap:6px;padding:10px 0 4px}
.tabs button{flex:1;border:0;border-radius:12px;background:var(--surface);padding:10px 8px;font-weight:600;font-size:.95rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--canvas)}
.badge{display:inline-block;min-width:1.4em;margin-inline-start:6px;padding:0 6px;border-radius:99px;background:var(--accent);color:var(--accent-ink);font-size:.8rem;line-height:1.5}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.bar .grow{flex:1;min-width:140px}
.in,.bar input,.bar select,.fm input,.fm select,.fm textarea,.login input{border:0;border-radius:12px;background:var(--surface);padding:11px 14px;font-size:1rem;width:100%}
.bar select,.bar .in{width:auto}
.fm input,.fm select,.fm textarea{background:var(--canvas)}
.chip{flex:none}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;margin:12px 0;display:grid;gap:10px}
.card.b-new{box-shadow:inset 4px 0 0 var(--accent)}
.card.b-cancelled{opacity:.6}
.bh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mut{color:var(--muted)}.small{font-size:.88rem}
.tag{flex:none;border-radius:99px;padding:2px 10px;font-size:.82rem;font-weight:600;background:var(--canvas)}
.t-new{background:var(--accent);color:var(--accent-ink)}.t-confirmed{background:#0071e3;color:#fff}.t-done{background:#1a7f37;color:#fff}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px 16px}
.kv .k{display:block;color:var(--muted);font-size:.82rem}
.kv b{font-size:1.05rem}
.soon{color:#c4301c}
.items{margin:0;padding-inline-start:1.4em;display:grid;gap:3px}
.note{margin:0;background:var(--canvas);border-radius:10px;padding:8px 12px}
.acts2{display:flex;flex-wrap:wrap;gap:8px}
.acts2 input{flex:1;min-width:160px;border:0;border-radius:12px;background:var(--canvas);padding:8px 12px;font-size:.95rem}
.btn{border:0;border-radius:999px;padding:8px 16px;font-weight:600;background:var(--canvas);font-size:.92rem}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--ink);color:var(--canvas)}
.btn.bad{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5}
.plist{background:var(--surface);border-radius:var(--r);overflow:hidden}
.prow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px 14px;text-align:start}
.prow:first-child{border-top:0}
.prow img,.prow .ph{width:48px;height:48px;border-radius:8px;object-fit:cover;background:var(--canvas)}
.prow .nm{font-weight:600;overflow-wrap:anywhere}
.prow .pr{text-align:end;font-variant-numeric:tabular-nums;font-weight:600}
.off{opacity:.55}
dialog{border:0;border-radius:var(--r);padding:0;max-width:640px;width:calc(100% - 24px);max-height:92vh;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.5)}
.fm{display:grid;gap:12px;padding:18px}
.fm label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.fm .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fm h2,.sect h2{font-size:1.2rem;margin:0}
.photos{display:flex;flex-wrap:wrap;gap:10px}
.photos .pic{position:relative;width:92px}
.photos img{width:92px;height:92px;object-fit:cover;border-radius:10px;display:block;background:var(--canvas)}
.photos .pic button{margin-top:4px;width:100%;font-size:.78rem;padding:4px}
.photos .cover{position:absolute;left:4px;top:4px;background:var(--accent);color:var(--accent-ink);font-size:.72rem;font-weight:700;border-radius:99px;padding:1px 7px}
.sect{background:var(--surface);border-radius:var(--r);padding:18px;margin:14px 0;display:grid;gap:12px}
.sect .hint{margin:0}
.fm label.ck{display:flex;gap:10px;align-items:center}
.fm label.ck input{width:auto;flex:none}
.sect>input{border:0;border-radius:12px;background:var(--canvas);padding:11px 14px;font-size:1rem;width:100%}
.crow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.msg{min-height:1.3em;font-size:.95rem}
.msg.good{color:#1a7f37}.msg.bad{color:var(--bad)}
.login{max-width:380px;margin:12vh auto 0;background:var(--surface);border-radius:var(--r);padding:26px;display:grid;gap:14px}
.login h1{font-size:1.5rem;margin:0}
.login input{background:var(--canvas)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:rgba(29,29,31,.95);color:#fff;border-radius:99px;padding:10px 20px;z-index:60;font-weight:600}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (prefers-color-scheme:dark){.good{color:#5fd07a}.soon{color:#ff8a78}}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.99.3/dist/umd/supabase.js" integrity="sha384-DvC+YdtlL7wvOOuSrDKDL78GehYjJ2hsSfAWUFv5Rz7YcdCjlLMADTYKYym7cZrB" crossorigin="anonymous"></script>
<script src="data.js"></script>
<script src="config.js"></script>
<script src="admin.js"></script>
</body>
</html>
