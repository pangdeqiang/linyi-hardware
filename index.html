<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>临沂五金建材 Linyi Hardware</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: sticky graphite bar, hazard-stripe hero, a dense bilingual price list with photo stacks, then booking and contact. */
:root{
  --bg:#EBEEEE;
  --surface:#F8F9F9;
  --ink:#1B2227;
  --muted:#546068;
  --line:#CBD2D5;
  --accent:#F0B400;
  --accent-ink:#1B2227;
  --bar:#1B2227;
  --bar-ink:#F2F4F4;
  --stripe:#1B2227;
  --focus:#1B6FD9;
  --bad:#B3341F;
  --display:"Barlow Condensed","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
  --text:"Barlow","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171A;--surface:#1B2227;--ink:#E7ECEE;--muted:#9AA6AD;--line:#2E383E;
    --accent:#F0B400;--accent-ink:#1B2227;--bar:#0B0F11;--bar-ink:#E7ECEE;--stripe:#0B0F11;--focus:#6AA9FF;--bad:#EF8A78;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12171A;--surface:#1B2227;--ink:#E7ECEE;--muted:#9AA6AD;--line:#2E383E;
  --accent:#F0B400;--accent-ink:#1B2227;--bar:#0B0F11;--bar-ink:#E7ECEE;--stripe:#0B0F11;--focus:#6AA9FF;--bad:#EF8A78;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--text);font-size:16px;line-height:1.55}
.w{max-width:1080px;margin:0 auto;padding-inline:16px}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:700;text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:clamp(1.7rem,4.5vw,2.2rem)}
section{scroll-margin-top:112px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bar);color:var(--bar-ink)}
.bar{max-width:1080px;margin:0 auto;padding:8px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand lang" "nav nav";gap:2px 12px;align-items:center}
.brand{grid-area:brand;font-family:var(--display);font-weight:700;font-size:1.3rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
nav{grid-area:nav;display:flex;gap:2px;overflow-x:auto;margin-inline:-8px}
nav a{padding:6px 10px;border-radius:4px;text-decoration:none;font-size:.95rem;white-space:nowrap}
nav a:hover{background:rgba(255,255,255,.12)}
.lang{grid-area:lang;display:flex;border:1.5px solid var(--bar-ink);border-radius:6px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--bar-ink);padding:5px 12px;cursor:pointer;font-weight:600;font-size:.9rem;min-width:3.2rem}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
@media (min-width:720px){
  .bar{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"brand nav lang";gap:16px;padding-block:10px}
  nav{margin-inline:0}
}

/* hero */
.stripe{height:12px;background:repeating-linear-gradient(-45deg,var(--accent) 0 14px,var(--stripe) 14px 28px)}
.hero{padding-block:28px 12px}
.hero h1{font-size:clamp(2.1rem,7vw,3.8rem);max-width:16em}
.btn{border:0;border-radius:6px;padding:10px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600;cursor:pointer;text-decoration:none;display:inline-block;text-align:center}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.6;cursor:default}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pn{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 8px 8px 14px}
.pn .k{color:var(--muted);font-size:.9rem}
.pn .k,.pn .btn{white-space:nowrap}
.pn .num{font-family:var(--display);font-weight:700;font-size:1.5rem;letter-spacing:.02em;text-decoration:none;font-variant-numeric:tabular-nums}

/* products */
.sec{padding-block:36px 8px}
.sec h2{margin-bottom:6px}
.note{color:var(--muted);margin:0 0 16px;font-size:.95rem}
.tools{display:grid;gap:12px;margin-bottom:12px}
input[type="search"],input[type="text"],input[type="tel"],input[type="date"],select,textarea{width:100%;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:1.5px solid var(--line);border-radius:99px;padding:5px 12px;cursor:pointer;font-size:.92rem}
.chip .n{color:var(--muted);font-variant-numeric:tabular-nums;margin-inline-start:4px}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chip[aria-pressed="true"] .n{color:var(--bg);opacity:.75}
.count{color:var(--muted);font-size:.92rem;margin:4px 0 8px;font-variant-numeric:tabular-nums}
.grp{margin-top:20px}
.grp h3{font-size:1.35rem;padding:6px 12px;background:var(--accent);color:var(--accent-ink);border-radius:4px 4px 0 0;display:flex;justify-content:space-between;gap:12px}
.grp h3 span{font-family:var(--text);font-size:.9rem;font-weight:600;align-self:center}
.list{background:var(--surface);border:1.5px solid var(--line);border-top:0;border-radius:0 0 4px 4px}
.hd,.row{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1.6fr) 8.5rem;gap:2px 16px;padding:9px 12px;align-items:baseline}
.hasmd .hd,.hasmd .row{grid-template-columns:72px minmax(0,1.4fr) minmax(0,1.6fr) 8.5rem;align-items:center}
.hd{color:var(--muted);font-size:.85rem;border-bottom:1.5px solid var(--line)}
.row+.row{border-top:1px solid var(--line)}
.row .nm{font-weight:600;overflow-wrap:anywhere}
.row .sp{color:var(--muted);overflow-wrap:anywhere}
.row .pr,.hd .pr{text-align:end}
.price{font-family:var(--display);font-weight:700;font-size:1.4rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.price small{font-family:var(--text);font-weight:400;font-size:.82rem;color:var(--muted);margin-inline-start:3px}
.price.ask{font-family:var(--text);font-size:.95rem;font-weight:600;color:var(--muted)}
@media (max-width:639px){
  .hd{display:none}
  .row{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"nm pr" "sp sp"}
  .hasmd .row{grid-template-columns:72px minmax(0,1fr) auto;grid-template-areas:"md nm pr" "md sp sp";align-items:center}
  .row .md{grid-area:md}
  .row .nm{grid-area:nm}.row .pr{grid-area:pr}.row .sp{grid-area:sp}
  .row .sp:empty{display:none}
}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:6px;color:var(--muted);display:grid;gap:12px;justify-items:start}

/* photo stack: the front photo with the next ones peeking out behind it */
.md{position:relative;min-height:44px;display:flex;align-items:center}
.stack{position:relative;display:block;width:66px;height:56px;padding:0;border:0;background:none;cursor:zoom-in}
.stack img{position:absolute;left:0;top:0;width:56px;height:56px;max-width:none;object-fit:cover;border-radius:8px;border:1.5px solid var(--surface);background:var(--line);box-shadow:0 1px 3px rgba(0,0,0,.3)}
.stack img:nth-of-type(1){z-index:3}
.stack img:nth-of-type(2){z-index:2;transform:translateX(7px) scale(.9)}
.stack img:nth-of-type(3){z-index:1;transform:translateX(13px) scale(.8)}
.stack .cnt{position:absolute;z-index:4;left:5px;bottom:5px;background:rgba(0,0,0,.68);color:#fff;font-size:.72rem;line-height:1;padding:3px 6px;border-radius:99px;font-variant-numeric:tabular-nums}
.addp{cursor:pointer}
.addp.big{width:100%;border:1.5px dashed var(--muted);background:transparent;border-radius:8px;padding:8px 4px;font-size:.8rem;color:var(--muted)}
.addp.small{position:absolute;right:-2px;top:-4px;z-index:5;width:26px;height:26px;border-radius:50%;border:0;padding:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:1.1rem;line-height:1}
.editbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 12px;margin-bottom:12px;border:1.5px dashed var(--accent);border-radius:8px;background:var(--surface)}
.hint{color:var(--muted);font-size:.9rem;margin:0}
.editmsg{min-height:1.4em;margin:0 0 8px;font-size:.92rem}

/* photo viewer */
#lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.92);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px calc(env(safe-area-inset-bottom,0px) + 12px)}
#lb img{max-width:100%;max-height:66vh;object-fit:contain;border-radius:6px}
#lbx{position:absolute;right:calc(12px);top:calc(env(safe-area-inset-top,0px) + 8px);width:44px;height:44px;border-radius:50%;border:1.5px solid #fff;background:transparent;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer}
.lbrow{display:flex;align-items:center;gap:14px;max-width:100%}
.lbrow button{width:44px;height:44px;border-radius:50%;border:1.5px solid #fff;background:transparent;color:#fff;font-size:1.5rem;line-height:1;cursor:pointer;flex:none}
#lbc{text-align:center;min-width:0;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
#lbe{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#lbe .btn.ghost{color:#fff;border-color:#fff}

/* services */
.svc{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px 28px;margin-top:12px}
.svc div{border-top:3px solid var(--ink);padding-top:10px}
.svc h3{font-size:1.3rem;margin-bottom:4px}
.svc p{margin:0;color:var(--muted)}

/* booking */
.bk{display:grid;gap:14px;max-width:640px;background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:18px}
.bk label{display:grid;gap:4px;font-weight:600;font-size:.95rem}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.err{color:var(--bad);margin:0;min-height:1.4em;font-size:.95rem}
#res{display:none;gap:10px}
#res textarea{min-height:170px}
.acts{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* contact */
footer{margin-top:48px;background:var(--bar);color:var(--bar-ink);padding-block:28px 32px}
footer h2{margin-bottom:14px}
.ct{display:grid;gap:10px}
.ct .pn{background:transparent;border-color:rgba(255,255,255,.28)}
.ct .pn .k{color:rgba(255,255,255,.7)}
.ct .btn.ghost{color:var(--bar-ink);border-color:var(--bar-ink)}
.fine{margin:18px 0 0;font-size:.85rem;color:rgba(255,255,255,.7)}
.sel{user-select:all}
.ctw{display:grid;gap:24px;grid-template-columns:minmax(0,1fr);align-items:start}
@media (min-width:720px){.ctw{grid-template-columns:minmax(0,1fr) auto;gap:40px}}
.qr{background:#fff;padding:10px;border-radius:8px;width:176px}
.qr svg{display:block;width:100%;height:auto}
.qrcap{margin:10px 0 0;font-size:.9rem;color:rgba(255,255,255,.85);max-width:176px}
.qrcol .btn.ghost{color:var(--bar-ink);border-color:var(--bar-ink);margin-top:10px}
</style>

const TP="/*DATA_"+"PHOTOS*/",TS="/*DATA_"+"SELF*/";
const SKEL='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>\n';
const MAXN=6,MAXPX=640,SOFT=6e6,HARD=11e6;
const $=id=>document.getElementById(id);
const BYK={};ITEMS.forEach(i=>{BYK[i.k]=i});
let PH={};try{PH=JSON.parse($("photos").textContent||"{}")||{}}catch(e){PH={}}
let lang="zh",cat="all",edit=false,canEdit=false,dirty=false,pendingKey=null,lb={k:null,i:0},lastFocus=null,busy=false;
try{const s=localStorage.getItem("lang");if(s==="zh"||s==="en")lang=s;else if(!/^zh/i.test(navigator.language||""))lang="en"}catch(e){if(!/^zh/i.test(navigator.language||""))lang="en"}
const L=()=>lang==="zh"?0:1;
const t=k=>T[lang][k];
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
const fmt=n=>String(Number(n));
function priceText(p){return typeof p==="number"?"¥"+fmt(p):String(p).split("/").map(x=>"¥"+x.trim()).join(" / ")}
function hasPhotos(){return Object.values(PH).some(a=>a&&a.length)}
function photoBytes(){let n=0;for(const k in PH)(PH[k]||[]).forEach(s=>{n+=s.length});return n}
function msg(s){$("edmsg").textContent=s||""}

function matches(it,q){
  if(!q)return true;
  const hay=(it.n[0]+" "+it.n[1]+" "+(it.s?it.s[0]+" "+it.s[1]:"")).toLowerCase();
  return hay.includes(q);
}
function mediaCell(it){
  const m=el("div","md"),ph=PH[it.k]||[];
  if(ph.length){
    const b=el("button","stack");b.type="button";
    b.setAttribute("aria-label",t("view_photos")+": "+it.n[L()]+" ("+ph.length+")");
    ph.slice(0,3).forEach(src=>{const im=new Image();im.src=src;im.alt="";im.loading="lazy";im.decoding="async";b.append(im)});
    if(ph.length>1)b.append(el("span","cnt",String(ph.length)));
    b.onclick=()=>openLb(it.k,0);
    m.append(b);
  }
  if(edit){
    const a=el("button","addp "+(ph.length?"small":"big"),ph.length?"+":t("ed_add"));a.type="button";
    a.setAttribute("aria-label",t("ed_add")+": "+it.n[L()]);
    a.onclick=()=>{if(ph.length>=MAXN){msg(t("ed_max"));return}pendingKey=it.k;$("fi").click()};
    m.append(a);
  }
  return m;
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  const found=ITEMS.filter(it=>matches(it,q));
  const counts={};found.forEach(it=>counts[it.c]=(counts[it.c]||0)+1);
  const chips=$("chips");chips.replaceChildren();
  const mk=(key,label,n)=>{const b=el("button","chip");b.type="button";b.setAttribute("aria-pressed",String(cat===key));b.append(label);b.append(el("span","n",String(n)));b.onclick=()=>{cat=key;render()};chips.append(b)};
  mk("all",t("all"),found.length);
  CATS.forEach(c=>{if(counts[c.k])mk(c.k,c.n[L()],counts[c.k])});
  if(cat!=="all"&&!counts[cat])cat="all";
  const shown=cat==="all"?found:found.filter(it=>it.c===cat);
  $("count").textContent=shown.length===ITEMS.length?t("count_all").replace("{n}",ITEMS.length):t("count_some").replace("{m}",shown.length).replace("{n}",ITEMS.length);
  const out=$("out");out.replaceChildren();
  const md=edit||hasPhotos();out.className=md?"hasmd":"";
  if(!shown.length){
    const d=el("div","empty",t("empty").replace("{q}",$("q").value.trim()));
    const b=el("button","btn ghost sm",t("clear"));b.type="button";b.onclick=()=>{$("q").value="";cat="all";render()};d.append(b);out.append(d);return;
  }
  CATS.forEach(c=>{
    const rows=shown.filter(it=>it.c===c.k);if(!rows.length)return;
    const g=el("div","grp");
    const h=el("h3",null,c.n[L()]);h.append(el("span",null,String(rows.length)));g.append(h);
    const list=el("div","list");
    const hd=el("div","hd");hd.setAttribute("aria-hidden","true");
    if(md)hd.append(el("span"));
    hd.append(el("span",null,t("hd_name")),el("span",null,t("hd_spec")),el("span","pr",t("hd_price")));list.append(hd);
    rows.forEach(it=>{
      const r=el("div","row");
      if(md)r.append(mediaCell(it));
      r.append(el("div","nm",it.n[L()]));
      r.append(el("div","sp",it.s?it.s[L()]:""));
      const pr=el("div","pr");
      if(it.p===null){pr.append(el("span","price ask",t("ask")))}
      else{const p=el("span","price",priceText(it.p));if(it.u)p.append(el("small",null,"/ "+it.u[L()]));pr.append(p)}
      r.append(pr);list.append(r);
    });
    g.append(list);out.append(g);
  });
}
function updateEdit(){
  $("editbar").hidden=!canEdit;
  $("edtog").textContent=t(edit?"ed_off":"ed_on");
  $("edsave").hidden=!(canEdit&&edit&&dirty);$("eddisc").hidden=!(canEdit&&edit&&dirty);
  $("edhint").hidden=!(canEdit&&edit);
  $("edinfo").textContent=canEdit&&edit?t("ed_size").replace("{mb}",(photoBytes()/1e6).toFixed(1))+(dirty?" · "+t("ed_pending"):""):"";
}
function applyLang(){
  document.documentElement.lang=lang==="zh"?"zh-CN":"en";
  document.querySelectorAll("[data-i]").forEach(n=>{n.textContent=t(n.dataset.i)});
  document.querySelectorAll("[data-ip]").forEach(n=>{n.placeholder=t(n.dataset.ip)});
  $("l-zh").setAttribute("aria-pressed",String(lang==="zh"));
  $("l-en").setAttribute("aria-pressed",String(lang==="en"));
  $("q").setAttribute("aria-label",t("search"));
  $("lbx").setAttribute("aria-label",t("lb_close"));$("lbp").setAttribute("aria-label",t("lb_prev"));$("lbn").setAttribute("aria-label",t("lb_next"));
  updateEdit();render();if(!$("lb").hidden)showLb();
}
function setLang(l){lang=l;try{localStorage.setItem("lang",l)}catch(e){}applyLang()}
$("l-zh").onclick=()=>setLang("zh");

/* photo viewer */
function openLb(k,i){lb.k=k;lb.i=i;lastFocus=document.activeElement;$("lb").hidden=false;document.body.style.overflow="hidden";showLb();$("lbx").focus()}
function closeLb(){$("lb").hidden=true;document.body.style.overflow="";if(lastFocus&&lastFocus.focus&&document.contains(lastFocus))lastFocus.focus()}
function showLb(){
  const a=PH[lb.k]||[];if(!a.length){closeLb();return}
  lb.i=(lb.i+a.length)%a.length;
  $("lbi").src=a[lb.i];
  const it=BYK[lb.k];
  $("lbi").alt=it?it.n[L()]:"";
  $("lbc").textContent=(it?it.n[L()]+"  ":"")+(lb.i+1)+" / "+a.length;
  $("lbp").hidden=$("lbn").hidden=a.length<2;
  $("lbe").hidden=!(canEdit&&edit);
  $("lbcover").hidden=lb.i===0;
}
$("lbx").onclick=closeLb;
$("lbp").onclick=()=>{lb.i--;showLb()};
$("lbn").onclick=()=>{lb.i++;showLb()};
$("lb").addEventListener("click",e=>{if(e.target===$("lb"))closeLb()});
document.addEventListener("keydown",e=>{
  if($("lb").hidden)return;
  if(e.key==="Escape")closeLb();
  else if(e.key==="ArrowLeft"){lb.i--;showLb()}
  else if(e.key==="ArrowRight"){lb.i++;showLb()}
});
let tx=null;
$("lb").addEventListener("touchstart",e=>{tx=e.touches[0].clientX},{passive:true});
$("lb").addEventListener("touchend",e=>{if(tx===null)return;const dx=e.changedTouches[0].clientX-tx;tx=null;if(Math.abs(dx)>50){lb.i+=dx<0?1:-1;showLb()}});
$("lbcover").onclick=()=>{const a=PH[lb.k];if(!a)return;const[x]=a.splice(lb.i,1);a.unshift(x);lb.i=0;dirty=true;showLb();render();updateEdit()};
$("lbdel").onclick=()=>{const a=PH[lb.k];if(!a)return;a.splice(lb.i,1);if(!a.length)delete PH[lb.k];dirty=true;showLb();render();updateEdit()};

/* photo upload (owner only) */
async function toJpeg(file){
  let bmp;
  try{bmp=await createImageBitmap(file,{imageOrientation:"from-image"})}
  catch(e){bmp=await new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);res(im)};im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("img"))};im.src=u})}
  const w0=bmp.width||bmp.naturalWidth,h0=bmp.height||bmp.naturalHeight;
  if(!w0||!h0)throw new Error("size");
  const s=Math.min(1,MAXPX/Math.max(w0,h0));
  const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w0*s));c.height=Math.max(1,Math.round(h0*s));
  const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(bmp,0,0,c.width,c.height);
  if(bmp.close)bmp.close();
  return c.toDataURL("image/jpeg",0.6);
}
$("fi").addEventListener("change",async e=>{
  const files=[...e.target.files];e.target.value="";
  if(!pendingKey||!files.length)return;
  const k=pendingKey;pendingKey=null;msg(t("ed_busy"));
  const arr=PH[k]||(PH[k]=[]);let skipped=0,bad=0;
  for(const f of files){
    if(arr.length>=MAXN){skipped++;continue}
    try{arr.push(await toJpeg(f))}catch(_){bad++}
  }
  if(!arr.length)delete PH[k];
  dirty=true;render();updateEdit();
  msg(bad?t("ed_err_img"):skipped?t("ed_max"):"");
});
$("edtog").onclick=()=>{edit=!edit;msg("");updateEdit();render()};
$("eddisc").onclick=()=>{try{PH=JSON.parse($("photos").textContent||"{}")||{}}catch(e){PH={}}dirty=false;msg("");updateEdit();render()};
function esc(s){return s.replace(/</g,"\\u003c")}
function buildDoc(){
  const src=JSON.parse($("selfsrc").textContent);
  const body=src.replace(TP,()=>esc(JSON.stringify(PH))).replace(TS,()=>esc(JSON.stringify(src)));
  return SKEL+body+"</body></html>";
}
$("edsave").onclick=async()=>{
  if(busy)return;busy=true;$("edsave").disabled=true;msg(t("ed_saving"));
  try{
    if(photoBytes()>HARD)throw{code:"too_large"};
    const art=window.claude&&window.claude.use?await window.claude.use("artifact"):null;
    if(!art)throw{code:"not_granted"};
    const html=buildDoc();
    if(html.length>15e6)throw{code:"too_large"};
    await art.publish(html);
    msg(t("ed_done"));
  }catch(e){
    const c=e&&e.code;
    if(c==="not_writer"||c==="not_granted"||c==="capability_disabled"||c==="not_declared"){canEdit=false;edit=false;updateEdit();render();msg(t("ed_err_ro"))}
    else msg(c==="too_large"?t("ed_err_large"):c==="rate_limited"?t("ed_err_rate"):c==="conflict"?t("ed_conflict"):t("ed_err"));
  }
  busy=false;$("edsave").disabled=false;
};

/* copy buttons */
async function copyText(text,btn,after){
  const reset=()=>{btn.textContent=btn.dataset.i?t(btn.dataset.i):btn.textContent};
  const ok=()=>{if(after)after(true);btn.textContent=t("copied");setTimeout(reset,1600)};
  try{await navigator.clipboard.writeText(text);ok();return}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.position="fixed";ta.style.opacity="0";document.body.append(ta);ta.select();const done=document.execCommand("copy");ta.remove();if(done){ok();return}}catch(e){}
  if(after)after(false);
  btn.textContent=t("copy_fail");setTimeout(reset,2200);
}
document.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>copyText(b.dataset.copy,b)));

(async()=>{
